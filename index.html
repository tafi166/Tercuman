<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Magyar Türk Tercüman</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tercüman">
<meta name="theme-color" content="#2c6845">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* VOICE: warm, instant, nothing to learn; two people at one table
   IDEA: a folded table tent card, each face turned to its reader
   PICTURE: the two halves themselves, live bubbles and one big mic each
   COLOUR and TYPE: Hungarian green field, Turkish red field, white bubbles; Figtree
   LAYOUT: stacked halves, top one rotated 180deg, slim control strip in the fold */
:root{color-scheme:light dark;--hu:#2c6845;--tr:#c4122f;--bar:light-dark(#ffffff,#16181b);--barink:light-dark(#1c1c1c,#eceff1);--hot:#ffd23f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#111;color:#fff;font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr)}
.half{display:flex;flex-direction:column;padding:12px 14px;min-height:0;position:relative}
.half>*{width:100%;max-width:760px;margin-inline:auto}
.hu{background:var(--hu);padding-top:max(12px,env(safe-area-inset-top))}
.tr{background:var(--tr);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.face .hu{transform:rotate(180deg);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-top))}
.hd{display:flex;align-items:baseline;gap:10px}
.hd b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.hd small{font-size:14px;opacity:.85;flex:1}
.spk{width:22px;height:22px;opacity:0;transition:opacity .2s;align-self:center}
.speaking .spk{opacity:1;animation:blink 1s infinite}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px;overscroll-behavior:contain}
.msgs>:first-child{margin-top:auto}
.empty{margin:auto 0;text-align:center;font-size:17px;opacity:.85;max-width:30ch;align-self:center;text-wrap:balance}
.b{max-width:88%;padding:10px 15px;border-radius:20px;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.me{align-self:flex-end;background:rgba(255,255,255,.16);border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#fff;color:#1b1b1b;font-weight:600;font-size:21px;border-bottom-left-radius:6px;text-align:start}
.them.last{font-size:clamp(22px,6vw,30px)}
.them.err{background:#ffe3e3;color:#7a1020;font-size:16px}
.live{opacity:.75;font-style:italic}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:15px;white-space:nowrap}
.chip:active{background:rgba(255,255,255,.2)}
.ctl{display:flex;gap:10px;align-items:center}
.in{flex:1;display:flex;align-items:center;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 4px 4px 16px;min-height:52px}
.in input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:8px 0}
.in input::placeholder{color:rgba(255,255,255,.7)}
.in:focus-within{box-shadow:0 0 0 2px #fff}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.send svg{width:20px;height:20px}
.mic{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s,background .15s}
.hu .mic{color:var(--hu)}.tr .mic{color:var(--tr)}
.mic svg{width:34px;height:34px}.mic .st{display:none}
.mic:active{transform:scale(.94)}
.listening .mic{background:var(--hot);color:#1b1b1b;animation:pulse 1.4s infinite}
.listening .mic .mi{display:none}.listening .mic .st{display:block}
.hint{font-size:13px;opacity:.85;margin-top:8px;text-align:center;display:none}
.nomic .hint{display:block}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{background:var(--bar);color:var(--barink);display:flex;justify-content:center;align-items:center;gap:6px;padding:4px 10px}
.bar button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.bar button:hover{background:light-dark(#f0f0f0,#24272b)}
.bar svg{width:22px;height:22px}
.bar .on{color:light-dark(#0b6b3a,#7fdca5)}
.bar .arm{background:#c4122f!important;color:#fff}
.bar span{font-size:13px;opacity:.7;padding:0 6px;white-space:nowrap}
.off .sOn,.bar .sOff{display:none}.off .sOff{display:block}
@media(min-width:820px){
 .side .app{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .side .bar{flex-direction:column;padding:10px 4px}
 .side .bar span{writing-mode:vertical-rl}
 .side .hu,.side .tr{padding:18px 22px}
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,63,.7)}100%{box-shadow:0 0 0 22px rgba(255,210,63,0)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="face">
<div class="app">
 <section class="half hu" id="hu" lang="hu">
  <div class="hd"><b>Magyar</b><small id="st-hu">Koppintson és beszéljen</small><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></div>
  <div class="msgs" id="m-hu" aria-live="polite"></div>
  <div class="chips" id="c-hu"></div>
  <div class="ctl">
   <form class="in" data-side="hu"><input id="in-hu" placeholder="Írjon ide…" autocomplete="off" enterkeyhint="send" aria-label="Szöveg"><button class="send" aria-label="Küldés"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9z"/></svg></button></form>
   <button class="mic" data-side="hu" aria-label="Mikrofon"><svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><svg class="st" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>
  <p class="hint">Nincs mikrofon? Koppintson a mezőbe, és használja a billentyűzet mikrofonját.</p>
 </section>

 <nav class="bar" aria-label="Ayarlar">
  <button id="bMode" class="on" title="Yüz yüze / Szemtől szemben" aria-label="Yüz yüze modu"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3 3 7h3v10h2V7h3L7 3Zm10 18 4-4h-3V7h-2v10h-3l4 4Z"/></svg></button>
  <button id="bSpk" class="on" title="Sesli okuma / Felolvasás" aria-label="Sesli okuma"><svg class="sOn" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg><svg class="sOff" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  <span id="eng">HU ⇄ TR</span>
  <button id="bClr" title="Temizle / Törlés" aria-label="Konuşmayı temizle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Z"/></svg></button>
 </nav>

 <section class="half tr" id="tr" lang="tr">
  <div class="hd"><b>Türkçe</b><small id="st-tr">Dokun ve konuş</small><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></div>
  <div class="msgs" id="m-tr" aria-live="polite"></div>
  <div class="chips" id="c-tr"></div>
  <div class="ctl">
   <form class="in" data-side="tr"><input id="in-tr" placeholder="Buraya yaz…" autocomplete="off" enterkeyhint="send" aria-label="Metin"><button class="send" aria-label="Gönder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9z"/></svg></button></form>
   <button class="mic" data-side="tr" aria-label="Mikrofon"><svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><svg class="st" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>
  <p class="hint">Mikrofon çalışmıyor mu? Kutuya dokun ve klavyedeki mikrofon tuşuyla konuş.</p>
 </section>
</div>

<script>
{
const L={
 hu:{en:'Hungarian',other:'tr',bcp:'hu-HU',tap:'Koppintson és beszéljen',listen:'Hallgatom…',work:'Fordítás…',empty:'Koppintson a mikrofonra, és beszéljen magyarul. A partnere törökül hallja a fordítást.',err:'Nem sikerült lefordítani. Próbálja újra.'},
 tr:{en:'Turkish',other:'hu',bcp:'tr-TR',tap:'Dokun ve konuş',listen:'Dinliyorum…',work:'Çevriliyor…',empty:'Mikrofona dokun ve Türkçe konuş. Karşındaki kişi çeviriyi Macarca duyar.',err:'Çeviri yapılamadı. Tekrar dene.'}};
const PH=[['Jó napot!','Merhaba!'],['Köszönöm.','Teşekkür ederim.'],['Igen.','Evet.'],['Nem.','Hayır.'],['Nem értem, megismételné?','Anlamadım, tekrar eder misiniz?'],['Lassabban beszélne, kérem?','Daha yavaş konuşur musunuz?'],['Egy pillanat, kérem!','Bir dakika lütfen.'],['Mennyibe kerül?','Bu ne kadar?']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const code=e=>e&&(e.code||e.error||e.message)||String(e);
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';

let msgs=load('hutr.msgs',[]),prefs=Object.assign({face:true,speak:true},load('hutr.prefs',{}));
let live=null,pending=null,speakingLang=null,dict=null,samp=null,ttsC=null,rec=null,unlocked=false,silT=0,maxT=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let FRAMED=true;try{FRAMED=window.top!==window}catch(e){}
let nativeOK=!!SR&&!FRAMED;

function render(){
 for(const s of ['hu','tr']){
  let h='';
  if(!msgs.length&&!pending&&!live)h=`<p class="empty">${L[s].empty}</p>`;
  let lastThem=-1;msgs.forEach((m,i)=>{if(m.from!==s)lastThem=i});
  h+=msgs.map((m,i)=>{
   if(m.from===s)return `<div class="b me">${esc(m[s])}</div>`;
   if(m.err)return `<div class="b them err">${L[s].err}</div>`;
   return `<button class="b them${i===lastThem?' last':''}" data-i="${i}">${esc(m[s])}</button>`}).join('');
  if(live){const t=(live.text+' '+live.partial).trim();h+=live.side===s?`<div class="b me live">${t?esc(t):DOTS}</div>`:`<div class="b them">${DOTS}</div>`}
  if(pending)h+=pending.from===s?`<div class="b me">${esc(pending.text)}</div>`:`<div class="b them">${DOTS}</div>`;
  const el=$('#m-'+s);el.innerHTML=h;el.scrollTop=el.scrollHeight;
  const on=!!live&&live.side===s&&!live.stopping;
  const half=$('#'+s);half.classList.toggle('listening',on);half.classList.toggle('speaking',speakingLang===s);
  $('#st-'+s).textContent=on?L[s].listen:(pending||live&&live.stopping)?L[s].work:L[s].tap;
 }
}
function chips(){for(const s of ['hu','tr'])$('#c-'+s).innerHTML=PH.map((p,i)=>`<button class="chip" data-side="${s}" data-p="${i}">${esc(p[s==='hu'?0:1])}</button>`).join('')}
function applyPrefs(){
 document.body.className=prefs.face?'face':'side';
 $('#bMode').classList.toggle('on',prefs.face);
 $('#bSpk').classList.toggle('off',!prefs.speak);$('#bSpk').classList.toggle('on',prefs.speak);
 document.body.classList.toggle('nomic',!dict&&!nativeOK);
 save('hutr.prefs',prefs);
}
function push(m){msgs.push(m);if(msgs.length>60)msgs=msgs.slice(-60);save('hutr.msgs',msgs);render()}

/* ---------- speech out ---------- */
const SS=window.speechSynthesis;let voices=[];
function loadV(){try{voices=SS?SS.getVoices():[]}catch(e){}}
if(SS){loadV();try{SS.onvoiceschanged=loadV}catch(e){}}
const voiceFor=l=>voices.find(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(l));
function stopSpeak(){try{SS&&SS.cancel()}catch(e){}try{const p=ttsC&&ttsC.stop();p&&p.catch&&p.catch(()=>{})}catch(e){}speakingLang=null}
function unlock(){if(unlocked||!SS)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u)}catch(e){}}
function speak(text,l){
 if(!text)return;stopSpeak();const v=voiceFor(l);
 const done=()=>{speakingLang=null;render()};
 if(SS&&v){try{const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.95;u.onend=u.onerror=done;speakingLang=l;SS.speak(u);render();return}catch(e){}}
 if(ttsC){speakingLang=l;render();ttsC.speak(text,{language:l}).catch(()=>{}).finally(done);return}
 if(SS){try{const u=new SpeechSynthesisUtterance(text);u.lang=L[l].bcp;u.onend=u.onerror=done;speakingLang=l;SS.speak(u);render()}catch(e){}}
}
function speakMsg(m){if(prefs.speak&&!m.err){const t=L[m.from].other;speak(m[t],t)}}

/* ---------- speech in ---------- */
function arm(){clearTimeout(silT);if(live&&(live.text||live.partial))silT=setTimeout(stopListen,1900)}
function bump(){arm();render()}
function noMic(side){document.body.classList.add('nomic');const i=$('#in-'+side);i.focus();i.placeholder=side==='hu'?'Billentyűzet mikrofonja ↓':'Klavyedeki mikrofona bas ↓'}
function startListen(side){
 stopSpeak();unlock();
 if(dict){
  live={side,text:'',partial:'',eng:'dict'};render();
  let p;try{p=dict.start()}catch(e){p=Promise.reject(e)}
  Promise.resolve(p).catch(e=>{if(code(e)==='not_granted'){dict=null;applyPrefs()}live=null;render()});
  maxT=setTimeout(stopListen,45000);return;
 }
 if(SR&&nativeOK&&!FRAMED){
  try{
   rec=new SR();rec.lang=L[side].bcp;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
   live={side,text:'',partial:'',eng:'native'};
   rec.onresult=e=>{let f='',p='';for(const r of e.results){if(r.isFinal)f+=r[0].transcript;else p+=r[0].transcript}if(live){live.text=f.trim();live.partial=p.trim();bump()}};
   rec.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){nativeOK=false;applyPrefs()}};
   rec.onend=()=>{rec=null;finish()};
   rec.start();render();maxT=setTimeout(stopListen,45000);return;
  }catch(e){nativeOK=false;live=null;applyPrefs()}
 }
 noMic(side);
}
let stopT=0;
function stopListen(){
 clearTimeout(silT);clearTimeout(maxT);if(!live)return;
 if(live.stopping){finish();return}
 live.stopping=true;render();
 stopT=setTimeout(finish,1200);
 if(live.eng==='dict'&&dict){try{Promise.resolve(dict.stop()).then(finish,finish)}catch(e){finish()}}
 else if(rec){try{rec.stop()}catch(e){finish()}}
 else finish();
}
function finish(){
 clearTimeout(silT);clearTimeout(maxT);clearTimeout(stopT);if(!live)return;
 const side=live.side,t=(live.text+' '+live.partial).trim();live=null;
 if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}
 if(t)send(side,t);else render();
}

/* ---------- translation ---------- */
async function webTr(q,s,t){
 try{const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(q)}`);const j=await r.json();const o=j[0].map(x=>x[0]).join('');if(o)return o}catch(e){}
 try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${s}|${t}`);const j=await r.json();return j.responseData.translatedText||''}catch(e){}
 return '';
}
async function translate(side,text){
 const tgt=L[side].other;
 if(samp){
  const ctx=msgs.filter(m=>!m.err).slice(-4).map(m=>`${L[m.from].en} speaker: ${m[m.from]}`).join('\n');
  const prompt=`You are a live interpreter in a face-to-face conversation between a Hungarian speaker and a Turkish speaker.
The ${L[side].en} speaker just said the text below. It may come from speech recognition, so expect missing punctuation, misheard words, or Hungarian/Turkish words written phonetically in another language's spelling. Reconstruct the most likely intended sentence. If it is clearly in the other language, treat it as that language.
Translate it into natural, spoken ${L[tgt].en}. Keep tone, politeness level, names and numbers. Add nothing.
${ctx?'Recent conversation for context:\n'+ctx+'\n':''}
Text: """${text}"""
Answer with JSON only: {"from":"hu" or "tr","original":"cleaned original text","translation":"translated text"}`;
  try{
   const r=await samp(prompt,{modelTier:'quick',cache:false});const s=r.text||'';
   const j=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));
   if(j&&j.translation){const f=j.from==='hu'||j.from==='tr'?j.from:side;return{from:f,original:j.original||text,translation:j.translation}}
  }catch(e){if(code(e)==='not_granted')samp=null}
 }
 return{from:side,original:text,translation:await webTr(text,side,tgt)};
}
async function send(side,text,known){
 if(known){const m={from:side,hu:known[0],tr:known[1]};push(m);speakMsg(m);return}
 if(pending)return;
 pending={from:side,text};render();
 let r;try{r=await translate(side,text)}catch(e){r={from:side,original:text,translation:''}}
 pending=null;
 const m={from:r.from};m[r.from]=r.original;m[L[r.from].other]=r.translation;if(!r.translation)m.err=true;
 push(m);speakMsg(m);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const mic=e.target.closest('.mic');
 if(mic){const s=mic.dataset.side;if(live&&live.side===s)stopListen();else if(live){stopListen()}else startListen(s);return}
 const chip=e.target.closest('.chip');
 if(chip){unlock();send(chip.dataset.side,'',PH[+chip.dataset.p]);return}
 const b=e.target.closest('.them[data-i]');
 if(b){unlock();const m=msgs[+b.dataset.i];const s=b.closest('.half').id;if(m)speak(m[s],s)}
});
document.querySelectorAll('form.in').forEach(f=>f.addEventListener('submit',e=>{
 e.preventDefault();unlock();const s=f.dataset.side,i=$('#in-'+s),v=i.value.trim();if(!v)return;i.value='';i.blur();send(s,v);
}));
$('#bMode').onclick=()=>{prefs.face=!prefs.face;applyPrefs()};
$('#bSpk').onclick=()=>{prefs.speak=!prefs.speak;if(!prefs.speak)stopSpeak();applyPrefs();render()};
let clrT=0;$('#bClr').onclick=function(){
 if(this.classList.contains('arm')){clearTimeout(clrT);this.classList.remove('arm');msgs=[];save('hutr.msgs',msgs);stopSpeak();render()}
 else{this.classList.add('arm');clrT=setTimeout(()=>this.classList.remove('arm'),2500)}
};

/* ---------- platform capabilities ---------- */
let capsDone=false;
function caps(){
 const C=window.claude;if(capsDone||!(C&&C.use))return;capsDone=true;
 C.use('dictation').then(d=>{if(!d)return;dict=d;
  d.onPartial(({text})=>{if(live&&live.eng==='dict'){live.partial=text||'';bump()}});
  d.onFinal(({text})=>{if(live&&live.eng==='dict'){live.text=(live.text+' '+(text||'')).trim();live.partial='';bump()}});
  d.onState(({state})=>{if(state==='idle'&&live&&live.eng==='dict')finish()});
  applyPrefs()}).catch(()=>{});
 C.use('sample').then(s=>{if(s)samp=s}).catch(()=>{});
