<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Tercüman</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tercüman">
<meta name="theme-color" content="#c4122f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
@font-face{font-family:Unbounded;font-style:normal;font-weight:900;font-display:swap;src:url(fonts/unbounded-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* VOICE: warm, instant, nothing to learn; two people at one table
   IDEA: a folded table tent card, each face turned to its reader
   PICTURE: the two halves themselves, live bubbles and one big mic each
   COLOUR and TYPE: partner's field (green HU, blue EN, graphite DE), Turkish red field, white bubbles; Figtree
   LAYOUT: stacked halves, top one rotated 180deg, slim control strip in the fold */
:root{color-scheme:light dark;--far:#2c6845;--tr:#c4122f;--bar:light-dark(#ffffff,#16181b);--barink:light-dark(#1c1c1c,#eceff1);--hot:#ffd23f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#111;color:#fff;font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr)}
.half{display:flex;flex-direction:column;padding:12px 14px;min-height:0;position:relative;transition:background .3s}
.half>*{width:100%;max-width:760px;margin-inline:auto}
#far{background:var(--far);padding-top:max(12px,env(safe-area-inset-top))}
#tr{background:var(--tr);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.face #far{transform:rotate(180deg);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-top))}
.hd{display:flex;align-items:baseline;gap:9px}
.hd b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.hd small{font-size:14px;opacity:.85;flex:1}
.spk{width:22px;height:22px;opacity:0;transition:opacity .2s;align-self:center}
.speaking .spk{opacity:1;animation:blink 1s infinite}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px;overscroll-behavior:contain}
.msgs>:first-child{margin-top:auto}
.empty{margin:auto 0;text-align:center;font-size:17px;opacity:.85;max-width:30ch;align-self:center;text-wrap:balance}
.b{max-width:88%;padding:9px 14px;border-radius:18px;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.me{align-self:flex-end;background:rgba(255,255,255,.16);border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#fff;color:#1b1b1b;font-weight:600;font-size:17px;border-bottom-left-radius:6px;text-align:start;display:flex;align-items:flex-start;gap:8px;padding-inline-end:6px}
.them.last{font-size:19px}
.them>span{flex:1;padding-top:1px}
.say{flex:none;width:30px;height:30px;margin:-3px 0 -3px;border-radius:50%;display:grid;place-items:center;background:light-dark(#f0f0f0,#f0f0f0);color:#444}
.say svg{width:16px;height:16px}
.them.err{background:#ffe3e3;color:#7a1020;font-size:16px}
.live{opacity:.75;font-style:italic}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#c-far{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;padding-bottom:2px}
.chip{flex:none;min-height:40px;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:15px;white-space:nowrap}
.chip:active{background:rgba(255,255,255,.2)}
.ctl{display:flex;gap:10px;align-items:center}
.in{flex:1;display:flex;align-items:center;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 4px 4px 16px;min-height:52px}
.in input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:8px 0}
.in input::placeholder{color:rgba(255,255,255,.7)}
.in:focus-within{box-shadow:0 0 0 2px #fff}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.send svg{width:20px;height:20px}
.bgm{position:absolute;left:0;right:0;top:0;height:100%;max-width:none;display:grid;place-items:center;pointer-events:none;z-index:0}
.half>:not(.bgm){position:relative;z-index:1}
.orb{position:relative;width:var(--o,180px);height:var(--o,180px);display:grid;place-items:center;transition:opacity .45s,transform .45s}
.orb .rt{position:absolute;inset:0;width:100%;height:100%;animation:spin 16s linear infinite;transition:opacity .35s}
.orb .rt text{fill:#fff;font:800 19px Figtree,system-ui,sans-serif;letter-spacing:2px}
.orb .ring{width:38%;height:38%;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:0 0 0 9px rgba(255,255,255,.07);animation:breathe 2.6s ease-in-out infinite;transition:background .25s,color .25s}
.orb .ring svg{width:46%;height:46%}
.started .orb .rt{opacity:0;animation-play-state:paused}
.started .orb{opacity:.16;transform:scale(1.15)}
.listening .orb{opacity:.5;transform:scale(1)}
.listening .orb .ring{background:var(--hot);color:#1b1b1b;animation:hotp 1.3s ease-out infinite}
.half::after{content:'';position:absolute;inset:5px;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 0 3px var(--hot),inset 0 0 46px rgba(255,210,63,.35)}
.listening::after{opacity:1;animation:glow 1.6s ease-in-out infinite}
.half{cursor:pointer}.half input,.half .chips{cursor:auto}
.fl{width:28px;height:19px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none;align-self:center;display:block}
.seg .fl{width:20px;height:14px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:0 9px}
.bar{gap:2px}
@media(max-width:440px){.seg .cd{display:none}.seg button{min-width:44px;padding:0 10px}.bar>button{width:42px}}
.conv .fl{width:18px;height:12px;display:inline-block;vertical-align:-1px;margin-inline-end:4px}
.hint{font-size:13px;opacity:.85;margin-top:8px;text-align:center;display:none}
.nomic .hint{display:block}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{background:var(--bar);color:var(--barink);display:flex;justify-content:center;align-items:center;gap:6px;padding:4px 10px;flex-wrap:wrap}
.bar>button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.bar>button:hover{background:light-dark(#f0f0f0,#24272b)}
.bar svg{width:22px;height:22px}
.bar .on{color:light-dark(#0b6b3a,#7fdca5)}
.bar .arm{background:#c4122f!important;color:#fff}
.seg{display:flex;background:light-dark(#eef0f2,#24272b);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:48px;height:38px;border-radius:9px;font-size:14px;font-weight:800;letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--far);color:#fff}
.off .sOn,.bar .sOff{display:none}.off .sOff{display:block}
@media(min-width:820px){
 .side .app{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .side .bar,.side .seg{flex-direction:column}
 .side .bar{padding:10px 4px}
 .side #far,.side #tr{padding:18px 22px}
}
.spl{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--tr);color:#fff;text-align:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));cursor:pointer;transition:opacity .35s}
.spl.open{display:flex}
.spl.out{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none;transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease}
.app{transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.4s ease}
.intro .app{transform:scale(.94);filter:brightness(.6)}
.spl .go{visibility:hidden}.spl.wait .go{visibility:visible;animation:rise .5s ease-out both,blink 1.6s .5s ease-in-out infinite}
.logo{display:flex;align-items:center;font-family:Unbounded,Figtree,system-ui,sans-serif;font-weight:900;font-size:clamp(26px,7.6vw,38px);letter-spacing:.01em;line-height:1;margin-bottom:10px;animation:rise .7s ease-out both}
.logo .le{height:.8em;width:1.25em;margin:0 .08em 0 .02em;overflow:visible}
.logo .s1,.logo .s2,.logo .s3{animation:talk 1.2s ease-in-out infinite}
.logo .s2{animation-delay:.15s}.logo .s3{animation-delay:.3s}
.logo .tg{transform-origin:16px 16px;animation:tongue 1.2s ease-in-out infinite}
@keyframes talk{0%,100%{opacity:.45}40%{opacity:1}}
@keyframes tongue{0%,100%{transform:scaleX(.7)}40%{transform:scaleX(1)}}
.spl .sky{width:150px;height:100px;animation:rise .7s ease-out both}
.spl b{font-size:clamp(38px,11vw,60px);font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance;animation:rise .7s .1s ease-out both}
.spl small{font-size:16px;opacity:.8;animation:rise .7s .25s ease-out both}
.spl .ask-t{margin:0;font-size:18px;opacity:.9}
.nf{display:flex;gap:8px;width:min(380px,100%);margin-top:6px}
.nf input{flex:1;font:inherit;font-size:18px;padding:14px 18px;border-radius:999px;border:0;outline:0;background:#fff;color:#1b1b1b}
.nf input:focus{box-shadow:0 0 0 3px #ffd23f}
.nf button{min-height:52px;padding:0 22px;border-radius:999px;background:#ffd23f;color:#1b1b1b;font-weight:800;font-size:17px}
.chg{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));min-height:44px;padding:0 14px;font-size:14px;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.spl .ask-t,.spl .nf,.spl.ask .go,.spl.ask .chg{display:none}
.spl.ask .ask-t{display:block}.spl.ask .nf{display:flex}
.spl.ask{cursor:default}
.camb{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22)}
.camb svg{width:24px;height:24px}
.cam{position:fixed;inset:0;z-index:9;background:#000;color:#fff;display:none;overflow:hidden}
.cam.open{display:block}
.cview{position:absolute;inset:0}
#vid,#shotImg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#shotImg{display:none;object-fit:contain}
.cam.shot #vid{display:none}.cam.shot #shotImg{display:block;height:55%}
.cov{position:absolute;inset:0;pointer-events:none}
.ping{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #ffd23f;animation:ping .8s ease-out forwards}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.obox{position:absolute;border:3px solid #ffd23f;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);transition:all .2s}
.ccard{position:absolute;transform:translate(-50%,22px);background:#fff;color:#1b1b1b;border-radius:16px;padding:10px 14px;width:max-content;max-width:min(320px,86vw);box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:auto;text-align:start;animation:rise .25s ease-out}
.ccard.up{transform:translate(-50%,calc(-100% - 22px))}
.ccard b{display:block;font-size:22px;line-height:1.2}
.ccard .o{font-size:14px;color:#5a5a5a;margin-top:4px}
.ccard .pn{display:flex;align-items:center;gap:8px;font-size:17px;margin-top:6px}
.ccard .pn .fl{width:22px;height:15px}
.ccard .o .fl{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-inline-end:5px}
.ccard .tag{display:inline-block;margin-top:6px;font-size:13px;background:#fff3c4;border-radius:999px;padding:2px 10px}
.csay{width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:inline-grid;place-items:center;flex:none}
.csay svg{width:18px;height:18px}
.ctop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 14px 14px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.ctop button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);font-size:28px;line-height:1}
.clang{display:flex;align-items:center;gap:6px;font-weight:700;background:rgba(0,0,0,.45);border-radius:999px;padding:7px 12px;font-size:14px}
.clang .fl{width:20px;height:14px}
#cst{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.cbot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 16px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.65))}
.chint{margin:0;font-size:14px;text-align:center;opacity:.92;text-wrap:balance}
.snap{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);transition:transform .12s}
.snap:active{transform:scale(.92)}
.cam.shot .cbot,.cam.shot .chint{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;height:45%;background:#fff;color:#1b1b1b;border-radius:22px 22px 0 0;display:none;flex-direction:column;padding:14px 16px max(12px,env(safe-area-inset-bottom))}
.cam.shot .sheet{display:flex}
.sact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.sact>button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;background:#eef0f2}
.sact .pri{background:#c4122f;color:#fff}
.sact .ico{width:44px;padding:0;display:grid;place-items:center}
.sseg{display:flex;background:#eef0f2;border-radius:12px;padding:3px;margin-inline-end:auto}
.sseg button{min-height:38px;padding:0 12px;border-radius:9px;font-weight:700}
.sseg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.slist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.sitem{border-inline-start:4px solid #c4122f;padding:7px 11px;background:#f6f6f4;border-radius:10px}
.sitem .t{font-weight:700;font-size:16px;line-height:1.3}.sitem .o{font-size:13px;color:#666;margin-top:2px}
.snote{color:#555;font-size:15px;margin:8px 0}
.pan{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:light-dark(#f6f6f4,#121417);color:light-dark(#1b1b1b,#eceff1);padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.pan.open{display:flex}
.pan>*{width:100%;max-width:760px;margin-inline:auto}
.ph{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.ph h2{margin:0;font-size:22px;flex:1;line-height:1.15}
.ph button,.pact button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;background:light-dark(#e9eaec,#24272b)}
.ph .x{width:44px;padding:0;font-size:22px}
.srch{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid light-dark(#d5d5d5,#33363b);background:light-dark(#fff,#1c1e21);color:inherit;margin-bottom:10px}
.plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.conv{display:block;width:100%;text-align:start;background:light-dark(#fff,#1c1e21);border-radius:16px;padding:12px 14px;border-inline-start:6px solid var(--c,#888)}
.conv b{display:block;font-size:16px}.conv span{font-size:13px;opacity:.7}
.conv p{margin:4px 0 0;font-size:15px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv mark,.ln mark{background:#ffe27a;color:#1b1b1b;border-radius:3px}
button.ln{display:block;width:100%;text-align:start}
.ln{background:light-dark(#fff,#1c1e21);border-radius:14px;padding:10px 14px;border-inline-start:4px solid var(--c,#888)}
.ln.me{border-color:#c4122f}
.ln small{font-size:12px;opacity:.65;display:block}
.ln .t{font-size:17px;font-weight:600;margin:2px 0}
.ln .o{font-size:15px;opacity:.75}
.pact{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.pact .arm{background:#c4122f;color:#fff}
.pnote{font-size:13px;opacity:.65;text-align:center;margin:10px 0 0}
#pst{font-size:14px;font-weight:600;color:light-dark(#0b6b3a,#7fdca5);min-height:1.2em}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes breathe{50%{box-shadow:0 0 0 20px rgba(255,255,255,.02),0 0 0 9px rgba(255,255,255,.08)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hotp{0%{box-shadow:0 0 0 0 rgba(255,210,63,.6)}100%{box-shadow:0 0 0 26px rgba(255,210,63,0)}}
@keyframes glow{50%{opacity:.55}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
 <section class="half" id="far" lang="hu">
  <div class="bgm" id="bg-far" aria-hidden="true"><div class="orb"><svg class="rt" viewBox="0 0 200 200"><path id="cp-far" fill="none" d="M100,100 m-55,0 a55,55 0 1,1 110,0 a55,55 0 1,1 -110,0"/><text text-anchor="middle"><textPath href="#cp-far" startOffset="25%" id="w1-far"></textPath></text><text text-anchor="middle"><textPath href="#cp-far" startOffset="75%" id="w2-far"></textPath></text></svg><span class="ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></span></div></div>

 const n=(v.name||'')+' '+(v.voiceURI||'');

}

  C.cov.innerHTML=box+placeCard(x,y,objHtml+`<span class="tag">${DOTS} yazı aranıyor</span>`,M);
  farName(obj.class).then(n=>{if(id!==tapId||!n)return;obj.far=n;const el=$('#pn');if(el)el.innerHTML=`${flagSvg(prefs.far)}<span>${esc(n)}</span><button class="csay" data-say="${esc(n)}" aria-label="Dinle">${SAYICON}</button>`});
 }
 const txt=await txtP;if(id!==tapId)return;
 if(txt){
  C.cov.innerHTML=box+placeCard(x,y,`<b>${DOTS}</b><div class="o">${esc(txt)}</div>`,M);
  const tr=await webTr(txt,prefs.far,'tr');if(id!==tapId)return;
  C.cov.innerHTML=box+placeCard(x,y,`<b>${esc(tr||'Çeviri yapılamadı')}</b><div class="o">${flagSvg(prefs.far)} ${esc(txt)}</div>${obj?`<span class="tag">${esc(OBJ[obj.class])}</span>`:''}`,M);
 }else if(obj){
  const n=obj.far;C.cov.innerHTML=box+placeCard(x,y,`<b>${esc(OBJ[obj.class])}</b><div class="pn" id="pn">${flagSvg(prefs.far)}<span>${n?esc(n):DOTS}</span>${n?`<button class="csay" data-say="${esc(n)}" aria-label="Dinle">${SAYICON}</button>`:''}</div>`,M);
 }else{
  C.cov.innerHTML=placeCard(x,y,`<div class="o" style="margin:0">Burada belirgin bir nesne ya da yazı bulamadım. Biraz yaklaşıp tekrar dokun.</div>`,M);
 }
});
C.cov.addEventListener('click',e=>{const b=e.target.closest('.csay');if(b){e.stopPropagation();unlock();speak(b.dataset.say,prefs.far)}});
C.cov.style.pointerEvents='none';
/* --- full photo --- */
function wrapLines(g,t,w){const out=[];let line='';for(const word of t.split(' ')){const test=line?line+' '+word:word;if(!line||g.measureText(test).width<=w)line=test;else{out.push(line);line=word}}if(line)out.push(line);return out}
function fitText(g,t,x,y,w,h){let fs=Math.max(10,Math.min(h*.9,80)),lines=[];
 for(;fs>10;fs*=.92){g.font=`700 ${fs}px Figtree,system-ui,sans-serif`;lines=wrapLines(g,t,w);if(lines.length*fs*1.15<=h&&Math.max(...lines.map(l=>g.measureText(l).width))<=w*1.03)break}
 g.font=`700 ${fs}px Figtree,system-ui,sans-serif`;lines=wrapLines(g,t,w);g.textBaseline='top';g.textAlign='center';
 const y0=y+Math.max(0,(h-lines.length*fs*1.15)/2);lines.forEach((l,i)=>g.fillText(l,x+w/2,y0+i*fs*1.15));g.textAlign='start'}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
/* colour of the sign around the text (median of a thin ring), so the translation sits on the same background like a label */
function ringColor(g,x,y,w,h){
 const W=g.canvas.width,H=g.canvas.height,X=Math.max(0,Math.round(x)),Y=Math.max(0,Math.round(y)),R=Math.min(W,Math.round(x+w)),B=Math.min(H,Math.round(y+h)),px=[];
 const take=(x0,y0,ww,hh)=>{if(ww<1||hh<1)return;const d=g.getImageData(x0,y0,ww,hh).data;for(let i=0;i<d.length;i+=8)px.push([d[i],d[i+1],d[i+2]])};
 try{take(X,Y,R-X,3);take(X,B-3,R-X,3);take(X,Y,3,B-Y);take(R-3,Y,3,B-Y)}catch(e){}
 if(!px.length)return [255,255,255];
 return [0,1,2].map(c=>{const v=px.map(p=>p[c]).sort((a,b)=>a-b);return v[v.length>>1]});
}
function drawTranslated(src,blocks){
 const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.drawImage(src,0,0);
 for(const b of blocks){if(!b.tr)continue;const {x0,y0,x1,y1}=b.bbox,pad=Math.max(4,(y1-y0)*.06),x=x0-pad,y=y0-pad,w=x1-x0+pad*2,h=y1-y0+pad*2;
  const bg=ringColor(g,x,y,w,h);g.fillStyle=`rgb(${bg.join(',')})`;rrect(g,x,y,w,h,Math.min(14,h/4));g.fill();
  g.fillStyle=(bg[0]*.3+bg[1]*.59+bg[2]*.11)>140?'#141414':'#ffffff';fitText(g,b.tr,x+pad,y+pad*.6,w-pad*2,h-pad*1.2)}
 return c}
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`};
function prepFile(canvas,key){const s=shot;canvas.toBlob(b=>{if(b&&s)s.files[key]=new File([b],`tercuman-${s.stamp}${key==='tr'?'-ceviri':''}.jpg`,{type:'image/jpeg'})},'image/jpeg',.92)}
function showView(k){if(!shot)return;const cv=k==='tr'&&shot.tr?shot.tr:shot.orig;shot.view=cv===shot.tr?'tr':'orig';C.img.src=cv.toDataURL('image/jpeg',.9);
 $('#vTr').setAttribute('aria-pressed',shot.view==='tr');$('#vOr').setAttribute('aria-pressed',shot.view==='orig');$('#vTr').disabled=!shot.tr}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const it=items[i++];try{await fn(it)}catch(e){}}}))}
$('#cSnap').addEventListener('click',async e=>{
 e.stopPropagation();const frame=grab();if(!frame)return;const id=++tapId;
 shot={orig:frame,tr:null,files:{},stamp:stamp(),view:'orig'};
 C.v.pause();C.cov.innerHTML='';C.el.classList.add('shot');showView('orig');prepFile(frame,'orig');
 C.list.innerHTML=`<p class="snote">${DOTS} Yazılar okunuyor…</p>`;
 try{
  const blocks=await ocrPhoto(frame);if(id!==tapId)return;
  if(!blocks.length){C.list.innerHTML='<p class="snote">Fotoğrafta okunabilir bir yazı bulamadım. Yazıya biraz daha yaklaşıp düz tutarak tekrar dene.</p>';return}
  C.list.innerHTML=`<p class="snote">${DOTS} ${blocks.length} yazı parçası çevriliyor…</p>`;
  await pool(blocks,4,async b=>{b.tr=await webTr(b.text,prefs.far,'tr')});if(id!==tapId)return;
  C.list.innerHTML=blocks.map(b=>`<div class="sitem"><div class="t">${esc(b.tr||'(çevrilemedi)')}</div><div class="o">${esc(b.text)}</div></div>`).join('');
  shot.tr=drawTranslated(frame,blocks);prepFile(shot.tr,'tr');showView('tr');
 }catch(err){ocrBusy=false;cstat('ocr','');if(id===tapId)C.list.innerHTML='<p class="snote">Yazı tanıma yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.</p>'}
});
$('#vTr').onclick=()=>showView('tr');$('#vOr').onclick=()=>showView('orig');
$('#sRe').onclick=()=>{tapId++;shot=null;C.el.classList.remove('shot');C.img.removeAttribute('src');C.v.play().catch(()=>{})};
$('#sSave').onclick=()=>{
 if(!shot)return;const f=shot.files[shot.view];if(!f){cstat('msg','Hazırlanıyor, bir saniye sonra tekrar dene.',2000);return}
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
$('#bCam').addEventListener('click',e=>{e.stopPropagation();openCam()});
$('#cClose').addEventListener('click',e=>{e.stopPropagation();closeCam()});

/* ---------- welcome ---------- */
let NAME=load('tercuman.name','');
const WEL=['Günaydın','Tünaydın','İyi akşamlar'];
const SKY=[ /* morning sun on the horizon, afternoon sun, evening moon */
 '<g fill="#ffd23f"><circle cx="60" cy="62" r="22"/></g><g stroke="#ffd23f" stroke-width="4" stroke-linecap="round"><path d="M60 26v-12M33 38l-8-8M87 38l8-8M22 60H10M98 60h12"/></g><rect x="0" y="62" width="120" height="18" fill="#c4122f"/><path d="M6 64h108" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>',
 '<circle cx="60" cy="40" r="20" fill="#ffd23f"/><g stroke="#ffd23f" stroke-width="4" stroke-linecap="round"><path d="M60 8v-6M60 72v6M28 40h-6M92 40h6M37 17l-4-4M83 17l4-4M37 63l-4 4M83 63l4 4"/></g>',
 '<path d="M66 12a28 28 0 1 0 22 46A24 24 0 0 1 66 12Z" fill="#fff"/><g fill="#ffd23f"><circle cx="96" cy="20" r="2.5"/><circle cx="24" cy="18" r="2"/><circle cx="104" cy="52" r="1.6"/><circle cx="18" cy="56" r="1.6"/></g>'];
const spl=$('#spl');let wtext='',closing=false,splT=0;
/* slow fade: the welcome card dims and drifts away while the conversation screen settles in behind it */
function closeSplash(){
 if(closing||!spl.classList.contains('open'))return;closing=true;clearTimeout(splT);
 spl.classList.add('out');document.body.classList.remove('intro');
 setTimeout(()=>{spl.classList.remove('open','out','wait');closing=false},1700);
}
const greetText=()=>NAME?`${WEL[dayPart()]}, ${NAME}!`:`${WEL[dayPart()]}!`;
function askName(){spl.classList.add('ask');spl.classList.remove('wait');$('#wtx').textContent='Hoş geldin!';$('#nmIn').value=NAME}
/* speak the greeting; when it ends, fade away. onBlocked runs if the phone refuses sound without a tap */
function greet(onBlocked){
 if(!prefs.speak||!SS){splT=setTimeout(closeSplash,1800);return}
 let ok=false;
 try{const v=voiceFor('tr'),u=new SpeechSynthesisUtterance(wtext);if(v){u.voice=v;u.lang=v.lang}else u.lang='tr-TR';
  u.rate=1;u.onstart=()=>{ok=true;unlocked=true;clearTimeout(splT);splT=setTimeout(closeSplash,5000)};
  u.onend=u.onerror=()=>{if(ok)setTimeout(closeSplash,350)};
  SS.cancel();SS.speak(u);
 }catch(e){}
 setTimeout(()=>{if(!ok){try{SS.cancel()}catch(e){}onBlocked&&onBlocked()}},1000);
}
function welcome(){
 closing=false;clearTimeout(splT);
 wtext=greetText();$('#sky').innerHTML=SKY[dayPart()];spl.classList.remove('out','ask','wait');spl.classList.add('open');document.body.classList.add('intro');
 if(!NAME){askName();return}
 $('#wtx').textContent=`Hoş geldin, ${NAME}!`;
 greet(()=>spl.classList.add('wait'));
}
$('#nf').addEventListener('submit',e=>{
 e.preventDefault();e.stopPropagation();let v=$('#nmIn').value.trim().replace(/\s+/g,' ');
 if(v)v=v.split(' ').map(w=>w.charAt(0).toLocaleUpperCase('tr')+w.slice(1)).join(' ');
 NAME=v;save('tercuman.name',NAME);$('#nmIn').blur();
 wtext=greetText();$('#wtx').textContent=NAME?`Hoş geldin, ${NAME}!`:'Hoş geldin!';spl.classList.remove('ask');
 unlocked=true;greet(()=>splT=setTimeout(closeSplash,600));
});
$('#chg').addEventListener('click',e=>{e.stopPropagation();clearTimeout(splT);try{SS&&SS.cancel()}catch(_){}askName();setTimeout(()=>$('#nmIn').focus(),50)});
/* when sound was blocked, the first tap plays the greeting and starts the fade together */
spl.addEventListener('click',e=>{
 e.stopPropagation();if(spl.classList.contains('ask')||e.target.closest('.nf')||closing)return;
 let playing=false;try{playing=SS&&SS.speaking}catch(_){}
 if(prefs.speak&&!playing){unlocked=true;speak(wtext,'tr')}
 closeSplash();
});
let hiddenAt=0;const AWAY=2*60e3;
function freshStart(){if(C.el.classList.contains('open'))closeCam();if(live)finish();stopSpeak();archive();applyLang();render();welcome()}
setInterval(()=>{if(dayPart()!==partNow)applyLang()},60e3);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>AWAY)freshStart()});
window.addEventListener('pageshow',e=>{if(e.persisted)freshStart()});
applyLang();applyPrefs();render();placeOrb();
if(SS&&!voices.length)setTimeout(welcome,250);else welcome();
}
