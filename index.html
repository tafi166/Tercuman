<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Tercüman</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tercüman">
<meta name="theme-color" content="#c4122f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* VOICE: warm, instant, nothing to learn; two people at one table
   IDEA: a folded table tent card, each face turned to its reader
   PICTURE: the two halves themselves, live bubbles and one big mic each
   COLOUR and TYPE: partner's field (green HU, blue EN, graphite DE), Turkish red field, white bubbles; Figtree
   LAYOUT: stacked halves, top one rotated 180deg, slim control strip in the fold */
:root{color-scheme:light dark;--far:#2c6845;--tr:#c4122f;--bar:light-dark(#ffffff,#16181b);--barink:light-dark(#1c1c1c,#eceff1);--hot:#ffd23f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#111;color:#fff;font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr)}
.half{display:flex;flex-direction:column;padding:12px 14px;min-height:0;position:relative;transition:background .3s}
.half>*{width:100%;max-width:760px;margin-inline:auto}
#far{background:var(--far);padding-top:max(12px,env(safe-area-inset-top))}
#tr{background:var(--tr);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.face #far{transform:rotate(180deg);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-top))}
.hd{display:flex;align-items:baseline;gap:9px}
.hd b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.hd small{font-size:14px;opacity:.85;flex:1}
.spk{width:22px;height:22px;opacity:0;transition:opacity .2s;align-self:center}
.speaking .spk{opacity:1;animation:blink 1s infinite}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px;overscroll-behavior:contain}
.msgs>:first-child{margin-top:auto}
.empty{margin:auto 0;text-align:center;font-size:17px;opacity:.85;max-width:30ch;align-self:center;text-wrap:balance}
.b{max-width:88%;padding:9px 14px;border-radius:18px;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.me{align-self:flex-end;background:rgba(255,255,255,.16);border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#fff;color:#1b1b1b;font-weight:600;font-size:17px;border-bottom-left-radius:6px;text-align:start;display:flex;align-items:flex-start;gap:8px;padding-inline-end:6px}
.them.last{font-size:19px}
.them>span{flex:1;padding-top:1px}
.say{flex:none;width:30px;height:30px;margin:-3px 0 -3px;border-radius:50%;display:grid;place-items:center;background:light-dark(#f0f0f0,#f0f0f0);color:#444}
.say svg{width:16px;height:16px}
.them.err{background:#ffe3e3;color:#7a1020;font-size:16px}
.live{opacity:.75;font-style:italic}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:15px;white-space:nowrap}
.chip:active{background:rgba(255,255,255,.2)}
.ctl{display:flex;gap:10px;align-items:center}
.in{flex:1;display:flex;align-items:center;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 4px 4px 16px;min-height:52px}
.in input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:8px 0}
.in input::placeholder{color:rgba(255,255,255,.7)}
.in:focus-within{box-shadow:0 0 0 2px #fff}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.send svg{width:20px;height:20px}
.voice{flex:none;height:56px;min-width:128px;padding:0 18px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.95);color:var(--c);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 -2px 0 rgba(0,0,0,.06);transition:min-width .25s,background .2s,transform .12s;font-weight:800;font-size:16px}
#far .voice{--c:var(--far)}#tr .voice{--c:var(--tr)}
.voice:active{transform:scale(.96)}
.voice .mi{width:22px;height:22px}
.wave{display:none;align-items:center;gap:3px;height:22px}
.listening .voice .wave{display:inline-flex}.listening .voice .mi{display:none}
.wave i{width:3px;height:100%;border-radius:2px;background:currentColor;transform:scaleY(.25);opacity:.55}
.wave i:nth-child(2),.wave i:nth-child(4){transform:scaleY(.45)}.wave i:nth-child(3){transform:scaleY(.6)}
.listening .ctl .in{display:none}
.listening .voice{flex:1;background:var(--hot);color:#1b1b1b}
.listening .wave i{opacity:1;animation:wv .9s ease-in-out infinite}
.listening .wave i:nth-child(2){animation-delay:-.15s}.listening .wave i:nth-child(3){animation-delay:-.3s}.listening .wave i:nth-child(4){animation-delay:-.45s}.listening .wave i:nth-child(5){animation-delay:-.6s}
.half::after{content:'';position:absolute;inset:5px;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 0 3px var(--hot),inset 0 0 46px rgba(255,210,63,.35)}
.listening::after{opacity:1;animation:glow 1.6s ease-in-out infinite}
.half{cursor:pointer}.half input,.half .chips{cursor:auto}
.fl{width:28px;height:19px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none;align-self:center;display:block}
.seg .fl{width:20px;height:14px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:0 9px}
.bar{gap:2px}
@media(max-width:440px){.seg .cd{display:none}.seg button{min-width:44px;padding:0 10px}.bar>button{width:42px}}
.conv .fl{width:18px;height:12px;display:inline-block;vertical-align:-1px;margin-inline-end:4px}
.hint{font-size:13px;opacity:.85;margin-top:8px;text-align:center;display:none}
.nomic .hint{display:block}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{background:var(--bar);color:var(--barink);display:flex;justify-content:center;align-items:center;gap:6px;padding:4px 10px;flex-wrap:wrap}
.bar>button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.bar>button:hover{background:light-dark(#f0f0f0,#24272b)}
.bar svg{width:22px;height:22px}
.bar .on{color:light-dark(#0b6b3a,#7fdca5)}
.bar .arm{background:#c4122f!important;color:#fff}
.seg{display:flex;background:light-dark(#eef0f2,#24272b);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:48px;height:38px;border-radius:9px;font-size:14px;font-weight:800;letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--far);color:#fff}
.off .sOn,.bar .sOff{display:none}.off .sOff{display:block}
@media(min-width:820px){
 .side .app{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .side .bar,.side .seg{flex-direction:column}
 .side .bar{padding:10px 4px}
 .side #far,.side #tr{padding:18px 22px}
}
.pan{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:light-dark(#f6f6f4,#121417);color:light-dark(#1b1b1b,#eceff1);padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.pan.open{display:flex}
.pan>*{width:100%;max-width:760px;margin-inline:auto}
.ph{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.ph h2{margin:0;font-size:22px;flex:1;line-height:1.15}
.ph button,.pact button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;background:light-dark(#e9eaec,#24272b)}
.ph .x{width:44px;padding:0;font-size:22px}
.srch{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid light-dark(#d5d5d5,#33363b);background:light-dark(#fff,#1c1e21);color:inherit;margin-bottom:10px}
.plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.conv{display:block;width:100%;text-align:start;background:light-dark(#fff,#1c1e21);border-radius:16px;padding:12px 14px;border-inline-start:6px solid var(--c,#888)}
.conv b{display:block;font-size:16px}.conv span{font-size:13px;opacity:.7}
.conv p{margin:4px 0 0;font-size:15px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv mark,.ln mark{background:#ffe27a;color:#1b1b1b;border-radius:3px}
button.ln{display:block;width:100%;text-align:start}
.ln{background:light-dark(#fff,#1c1e21);border-radius:14px;padding:10px 14px;border-inline-start:4px solid var(--c,#888)}
.ln.me{border-color:#c4122f}
.ln small{font-size:12px;opacity:.65;display:block}
.ln .t{font-size:17px;font-weight:600;margin:2px 0}
.ln .o{font-size:15px;opacity:.75}
.pact{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.pact .arm{background:#c4122f;color:#fff}
.pnote{font-size:13px;opacity:.65;text-align:center;margin:10px 0 0}
#pst{font-size:14px;font-weight:600;color:light-dark(#0b6b3a,#7fdca5);min-height:1.2em}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes glow{50%{opacity:.55}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="face">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="fl-hu" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#436f4d"/><rect width="30" height="13.34" fill="#fff"/><rect width="30" height="6.67" fill="#cd2a3e"/></symbol>
 <symbol id="fl-de" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#ffce00"/><rect width="30" height="13.34" fill="#dd0000"/><rect width="30" height="6.67" fill="#000"/></symbol>
 <symbol id="fl-tr" viewBox="0 0 30 20"><rect width="30" height="20" fill="#e30a17"/><circle cx="10" cy="10" r="5" fill="#fff"/><circle cx="11.25" cy="10" r="4" fill="#e30a17"/><polygon fill="#fff" points="14.50,10.00 16.19,9.41 16.23,7.62 17.31,9.05 19.02,8.53 18.00,10.00 19.02,11.47 17.31,10.95 16.23,12.38 16.19,10.59"/></symbol>

  <div class="hd"><svg class="fl" id="fg-far"><use href="#fl-hu"/></svg><b id="nm-far">Magyar</b><small id="st-far"></small><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></div>

   <button class="voice" data-side="far" id="vb-far"><svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="vl" id="vl-far"></span></button>

 </section>

 <nav class="bar" aria-label="Ayarlar">
  <button id="bMode" class="on" title="Yüz yüze / yan yana" aria-label="Yüz yüze modu"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3 3 7h3v10h2V7h3L7 3Zm10 18 4-4h-3V7h-2v10h-3l4 4Z"/></svg></button>
  <div class="seg" role="group" aria-label="Karşı dil">
   <button data-far="hu" title="Macarca"><svg class="fl"><use href="#fl-hu"/></svg><span class="cd">HU</span></button><button data-far="en" title="İngilizce"><svg class="fl"><use href="#fl-en"/></svg><span class="cd">EN</span></button><button data-far="de" title="Almanca"><svg class="fl"><use href="#fl-de"/></svg><span class="cd">DE</span></button>

  <button id="bClr" title="Yeni konuşma (iki kez dokun). Eskisi geçmişe kaydedilir." aria-label="Yeni konuşma"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v12H7l-3 3V4Zm7 3v2H9v2h2v2h2v-2h2V9h-2V7h-2Z"/></svg></button>

 </nav>

 <section class="half" id="tr" lang="tr">
  <div class="hd"><svg class="fl"><use href="#fl-tr"/></svg><b>Türkçe</b><small id="st-tr"></small><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></div>
  <div class="msgs" id="m-tr" aria-live="polite"></div>

</div>

<div class="pan" id="pan" role="dialog" aria-modal="true" aria-labelledby="panT">

</div>

{
const L={
 hu:{name:'Magyar',en:'Hungarian',trName:'Macarca',bcp:'hu-HU',color:'#2c6845',tap:'Koppintson bárhova',pill:'Beszéljen',listen:'Hallgatom…',stop:'Kész',work:'Fordítás…',ph:'Írjon ide…',send:'Küldés',

  hint:'Nincs mikrofon? Koppintson a mezőbe, és használja a billentyűzet mikrofonját.',kbd:'Billentyűzet mikrofonja ↓'},

 ['Merhaba!','Jó napot!','Hello!','Guten Tag!'],
 ['Teşekkür ederim.','Köszönöm.','Thank you.','Danke schön.'],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const code=e=>e&&(e.code||e.error||e.message)||String(e);
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';

let msgs=load('tercuman.msgs',[]),prefs=Object.assign({face:true,speak:true,far:'hu'},load('tercuman.prefs',{}));
if(!L[prefs.far]||prefs.far==='tr')prefs.far='hu';
let live=null,pending=null,speakingLang=null,dict=null,samp=null,ttsC=null,rec=null,unlocked=false,silT=0,maxT=0,stopT=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let FRAMED=true;try{FRAMED=window.top!==window}catch(e){}
let nativeOK=!!SR&&!FRAMED;
const lang=s=>s==='tr'?'tr':prefs.far;
const sideOf=l=>l==='tr'?'tr':'far';
const textFor=(m,l)=>m[l]||m[Object.keys(m).find(k=>L[k]&&k!=='tr'&&m[k])]||'';

function render(){
 for(const s of ['far','tr']){
  const l=lang(s),T=L[l];let h='';
  if(!msgs.length&&!pending&&!live)h=`<p class="empty">${s==='tr'?`Kendi tarafında herhangi bir yere dokun ve Türkçe konuş. Karşındaki kişi çeviriyi ${L[prefs.far].trName} duyar.`:T.empty}</p>`;
  let lastThem=-1;msgs.forEach((m,i)=>{if(sideOf(m.from)!==s)lastThem=i});
  h+=msgs.map((m,i)=>{
   if(sideOf(m.from)===s)return `<div class="b me">${esc(m[m.from])}</div>`;
   if(m.err)return `<div class="b them err">${T.err}</div>`;
   return `<div class="b them${i===lastThem?' last':''}" data-i="${i}"><span>${esc(textFor(m,l))}</span><button class="say" aria-label="▶"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></button></div>`}).join('');
  if(live){const t=(live.text+' '+live.partial).trim();h+=live.side===s?`<div class="b me live">${t?esc(t):DOTS}</div>`:`<div class="b them">${DOTS}</div>`}
  if(pending)h+=pending.side===s?`<div class="b me">${esc(pending.text)}</div>`:`<div class="b them">${DOTS}</div>`;
  const el=$('#m-'+s);el.innerHTML=h;el.scrollTop=el.scrollHeight;
  const on=!!live&&live.side===s&&!live.stopping;
  const half=$('#'+s);half.classList.toggle('listening',on);half.classList.toggle('speaking',!!speakingLang&&sideOf(speakingLang)===s);
  $('#st-'+s).textContent=on?T.listen:(pending||live&&live.stopping)?T.work:T.tap;
  $('#vl-'+s).textContent=on?T.listen.replace('…','')+' · '+T.stop:live&&live.stopping&&live.side===s?T.work:T.pill;
  $('#vb-'+s).setAttribute('aria-label',on?T.stop:T.pill);
 }
}
function applyLang(){
 const T=L[prefs.far];
 document.documentElement.style.setProperty('--far',T.color);
 $('#far').lang=prefs.far;$('#nm-far').textContent=T.name;$('#fg-far use').setAttribute('href','#fl-'+prefs.far);
 $('#in-far').placeholder=T.ph;$('#in-far').setAttribute('aria-label',T.ph);$('#sd-far').setAttribute('aria-label',T.send);
 $('#h-far').textContent=T.hint;$('#h-tr').textContent=L.tr.hint;
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.far===prefs.far));
 for(const s of ['far','tr']){const c=COL[lang(s)];$('#c-'+s).innerHTML=PH.map((p,i)=>`<button class="chip" data-side="${s}" data-p="${i}">${esc(p[c])}</button>`).join('')}
}
function applyPrefs(){
 document.body.className=prefs.face?'face':'side';
 $('#bMode').classList.toggle('on',prefs.face);
 $('#bSpk').classList.toggle('off',!prefs.speak);$('#bSpk').classList.toggle('on',prefs.speak);
 document.body.classList.toggle('nomic',!dict&&!nativeOK);
 save('tercuman.prefs',prefs);
}
function push(m){
 const last=msgs[msgs.length-1];if(last&&last.t&&Date.now()-last.t>IDLE)archive();
 m.t=Date.now();m.far=prefs.far;msgs.push(m);if(msgs.length>600)msgs=msgs.slice(-600);save('tercuman.msgs',msgs);render()}

/* ---------- history ---------- */
const IDLE=3*3600e3;let hist=load('tercuman.hist',[]);
function archive(){
 if(!msgs.length)return;
 const t0=msgs[0].t||Date.now();
 hist.unshift({id:t0+'-'+Math.random().toString(36).slice(2,6),start:t0,end:msgs[msgs.length-1].t||t0,msgs});
 if(hist.length>150)hist.length=150;
 let ok=false;while(!ok&&hist.length){try{localStorage.setItem('tercuman.hist',JSON.stringify(hist));ok=true}catch(e){if(hist.length<2)break;hist.pop()}}
 msgs=[];save('tercuman.msgs',msgs);
}
archive(); /* every fresh open or reload starts a clean conversation; the old one is kept in history */

/* ---------- speech out ---------- */
const SS=window.speechSynthesis;let voices=[];const vCache={};
function loadV(){try{voices=SS?SS.getVoices():[];for(const k in vCache)delete vCache[k]}catch(e){}}
if(SS){loadV();try{SS.onvoiceschanged=loadV}catch(e){}}
/* novelty and robotic voices that ship with iOS/macOS: never pick them */
const BAD=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|junior|ralph|fred|kathy|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|princess|vicki|victoria|agnes|bruce)\b/i;
const NICE={en:/samantha|ava|allison|susan|zoe|evan|nathan|tom|daniel|serena|kate|oliver|moira|karen|tessa|aaron|nicky|google us english|google uk english/i,
 de:/anna|helena|petra|markus|yannick|martin|google deutsch/i,hu:/mariska|tünde|google magyar/i,tr:/yelda|cem|google türkçe/i};
function vScore(v,l){
 const n=(v.name||'')+' '+(v.voiceURI||'');
 if(BAD.test(v.name||'')||/eloquence|novelty/i.test(n))return -1;
 let s=0;
 if(/premium/i.test(n))s+=100;else if(/enhanced|gelişmiş|verbessert|améliorée/i.test(n))s+=80;
 if(/siri/i.test(n))s+=60;
 if(/neural|natural|online/i.test(n))s+=50;
 if(/google/i.test(n))s+=40;
 if(NICE[l]&&NICE[l].test(n))s+=30;
 if((v.lang||'').replace('_','-')===L[l].bcp)s+=10;
 if(v.localService)s+=2;
 return s;
}

function voiceFor(l){
 if(vCache[l]&&voices.includes(vCache[l]))return vCache[l];
 const vs=voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(l)).map(v=>[vScore(v,l),v]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]);
 return vCache[l]=vs.length?vs[0][1]:null;
}
/* iOS keeps a quiet earpiece route after the mic was used; ask for normal playback */
function audioMode(t){try{if(navigator.audioSession)navigator.audioSession.type=t}catch(e){}}
function stopSpeak(){try{SS&&SS.cancel()}catch(e){}try{const p=ttsC&&ttsC.stop();p&&p.catch&&p.catch(()=>{})}catch(e){}speakingLang=null}
function unlock(){if(unlocked||!SS)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u)}catch(e){}}
function speak(text,l){
 if(!text)return;stopSpeak();audioMode('playback');const v=voiceFor(l);
 const done=()=>{speakingLang=null;render()};
 if(SS&&v){try{const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=1;u.pitch=1;u.volume=1;u.onend=u.onerror=done;speakingLang=l;SS.speak(u);render();return}catch(e){}}
 if(ttsC){speakingLang=l;render();ttsC.speak(text,{language:l}).catch(()=>{}).finally(done);return}
 if(SS){try{const u=new SpeechSynthesisUtterance(text);u.lang=L[l].bcp;u.onend=u.onerror=done;speakingLang=l;SS.speak(u);render()}catch(e){}}
}
function speakMsg(m){if(prefs.speak&&!m.err){const t=m.from==='tr'?prefs.far:'tr';speak(m[t],t)}}

/* ---------- speech in ---------- */
function arm(){clearTimeout(silT);if(live&&(live.text||live.partial))silT=setTimeout(stopListen,1900)}
function bump(){arm();render()}
function noMic(side){document.body.classList.add('nomic');const i=$('#in-'+side);i.focus();i.placeholder=L[lang(side)].kbd}
function startListen(side){
 stopSpeak();unlock();
 if(dict){
  live={side,text:'',partial:'',eng:'dict'};render();
  let p;try{p=dict.start()}catch(e){p=Promise.reject(e)}
  Promise.resolve(p).catch(e=>{if(code(e)==='not_granted'){dict=null;applyPrefs()}live=null;render()});
  maxT=setTimeout(stopListen,45000);return;
 }
 if(SR&&nativeOK){
  try{
   audioMode('play-and-record');
   rec=new SR();rec.lang=L[lang(side)].bcp;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
   live={side,text:'',partial:'',eng:'native'};
   rec.onresult=e=>{let f='',p='';for(const r of e.results){if(r.isFinal)f+=r[0].transcript;else p+=r[0].transcript}if(live){live.text=f.trim();live.partial=p.trim();bump()}};
   rec.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){nativeOK=false;applyPrefs()}};
   rec.onend=()=>{rec=null;finish()};
   rec.start();render();maxT=setTimeout(stopListen,45000);return;
  }catch(e){nativeOK=false;live=null;applyPrefs()}
 }
 noMic(side);
}
function stopListen(){
 clearTimeout(silT);clearTimeout(maxT);if(!live)return;
 if(live.stopping){finish();return}
 live.stopping=true;render();
 stopT=setTimeout(finish,1200);
 if(live.eng==='dict'&&dict){try{Promise.resolve(dict.stop()).then(finish,finish)}catch(e){finish()}}
 else if(rec){try{rec.stop()}catch(e){finish()}}
 else finish();
}
function finish(){
 clearTimeout(silT);clearTimeout(maxT);clearTimeout(stopT);if(!live)return;
 const side=live.side,t=(live.text+' '+live.partial).trim();live=null;
 if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}
 if(t)send(side,t);else render();
}

/* ---------- translation ---------- */
async function webTr(q,s,t){
 try{const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(q)}`);const j=await r.json();const o=j[0].map(x=>x[0]).join('');if(o)return o}catch(e){}
 try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${s}|${t}`);const j=await r.json();return j.responseData.translatedText||''}catch(e){}
 return '';
}
async function translate(src,text){
 const far=prefs.far,tgt=src==='tr'?far:'tr';
 if(samp){
  const ctx=msgs.filter(m=>!m.err&&(m.from==='tr'||m.from===far)).slice(-4).map(m=>`${L[m.from].en} speaker: ${m[m.from]}`).join('\n');
  const prompt=`You are a live interpreter in a face-to-face conversation between a ${L[far].en} speaker and a Turkish speaker.
The ${L[src].en} speaker just said the text below. It may come from speech recognition, so expect missing punctuation, misheard words, or words written phonetically in another language's spelling. Reconstruct the most likely intended sentence. If it is clearly in the other language of this conversation, treat it as that language.
Translate it into natural, spoken ${L[tgt].en}. Keep tone, politeness level, names and numbers. Add nothing.
${ctx?'Recent conversation for context:\n'+ctx+'\n':''}
Text: """${text}"""
Answer with JSON only: {"from":"${far}" or "tr","original":"cleaned original text","translation":"translated text"}`;
  try{
   const r=await samp(prompt,{modelTier:'quick',cache:false});const s=r.text||'';
   const j=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));
   if(j&&j.translation){const f=j.from===far||j.from==='tr'?j.from:src;return{from:f,original:j.original||text,translation:j.translation}}
  }catch(e){if(code(e)==='not_granted')samp=null}
 }
 return{from:src,original:text,translation:await webTr(text,src,tgt)};
}
async function send(side,text,row){
 const src=lang(side),far=prefs.far;
 if(row){const m={from:src,tr:row[0]};m[far]=row[COL[far]];push(m);speakMsg(m);return}
 if(pending)return;
 pending={side,text};render();
 let r;try{r=await translate(src,text)}catch(e){r={from:src,original:text,translation:''}}
 pending=null;
 const m={from:r.from};m[r.from]=r.original;m[r.from==='tr'?far:'tr']=r.translation;if(!r.translation)m.err=true;
 push(m);speakMsg(m);
}

/* ---------- events ---------- */
let typing=false;
document.addEventListener('pointerdown',e=>{const a=document.activeElement;typing=!!(a&&a.tagName==='INPUT'&&!e.target.closest('form.in'))},true);
document.addEventListener('click',e=>{
 const chip=e.target.closest('.chip');
 if(chip){unlock();send(chip.dataset.side,'',PH[+chip.dataset.p]);return}
 const say=e.target.closest('.say');
 if(say){unlock();const b=say.closest('.them[data-i]'),m=msgs[+b.dataset.i],l=lang(b.closest('.half').id);if(m)speak(textFor(m,l),l);return}
 const half=e.target.closest('.half');
 if(half&&!e.target.closest('form.in,.chips')){
  if(typing){typing=false;document.activeElement.blur();return}
  if(live)stopListen();else startListen(half.id);return}
 const sg=e.target.closest('.seg button');
 if(sg&&sg.dataset.far!==prefs.far){if(live)finish();stopSpeak();prefs.far=sg.dataset.far;applyLang();applyPrefs();render()}
});
document.querySelectorAll('form.in').forEach(f=>f.addEventListener('submit',e=>{
 e.preventDefault();unlock();const s=f.dataset.side,i=$('#in-'+s),v=i.value.trim();if(!v)return;i.value='';i.blur();send(s,v);
}));
$('#bMode').onclick=()=>{prefs.face=!prefs.face;applyPrefs()};
$('#bSpk').onclick=()=>{prefs.speak=!prefs.speak;if(!prefs.speak)stopSpeak();applyPrefs();render()};
let clrT=0;$('#bClr').onclick=function(){
 if(this.classList.contains('arm')){clearTimeout(clrT);this.classList.remove('arm');if(live)finish();stopSpeak();archive();render()}
 else{this.classList.add('arm');clrT=setTimeout(()=>this.classList.remove('arm'),2500)}
};

/* ---------- history panel ---------- */
const P={pan:$('#pan'),list:$('#plist'),srch:$('#srch'),act:$('#pact'),back:$('#pBack'),title:$('#panT'),st:$('#pst'),del:$('#pDel')};
let openConv=null;
const fmtD=t=>new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtT=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const lc=s=>String(s||'').toLocaleLowerCase('tr');
const farOf=m=>m.far||['hu','en','de'].find(k=>m[k])||'hu';
const trOf=m=>m.tr||'',otherOf=m=>m[farOf(m)]||'';
const convFar=c=>[...new Set(c.msgs.map(farOf))];
function allConvs(){const c=msgs.length?[{start:msgs[0].t||Date.now(),end:msgs[msgs.length-1].t||Date.now(),msgs,cur:true}]:[];return c.concat(hist)}
function hl(text,q){const s=String(text||''),i=q?lc(s).indexOf(q):-1;if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
function line(m,q,ci,showDate){
 const me=m.from==='tr',f=farOf(m),tag=ci!=null?'button':'div';
 const who=me?'Sen':'Karşı taraf ('+(L[f]?L[f].trName:f)+')';
 const when=m.t?(showDate?fmtD(m.t):fmtT(m.t))+' · ':'';
 const main=m.err&&!me?'(çevrilemedi)':trOf(m),sub=otherOf(m);
 return `<${tag} class="ln${me?' me':''}"${ci!=null?` data-c="${ci}"`:''} style="--c:${L[f]?L[f].color:'#888'}"><small>${esc(when+who)}</small><div class="t">${hl(main,q)}</div>${sub?`<div class="o">${hl(sub,q)}</div>`:''}</${tag}>`;
}
function showList(){
 openConv=null;P.back.hidden=true;P.act.hidden=true;P.srch.hidden=false;P.title.textContent='Konuşma geçmişi';P.st.textContent='';
 const q=lc(P.srch.value.trim()),cs=allConvs();
 if(!cs.length){P.list.innerHTML='<p class="pnote">Henüz kayıtlı konuşma yok. Konuştukça burada birikecek.</p>';return}
 if(q){
  const res=[];cs.forEach((c,ci)=>c.msgs.forEach(m=>{if(lc(trOf(m)+'\n'+otherOf(m)).includes(q)||lc(fmtD(m.t||c.start)).includes(q))res.push([ci,m])}));
  P.list.innerHTML=res.length?res.slice(0,200).map(([ci,m])=>line(m,q,ci,true)).join(''):'<p class="pnote">Sonuç bulunamadı.</p>';return;
 }
 P.list.innerHTML=cs.map((c,ci)=>{
  const fl=convFar(c),first=c.msgs.find(m=>trOf(m))||c.msgs[0];
  return `<button class="conv" data-c="${ci}" style="--c:${L[fl[0]]?L[fl[0]].color:'#888'}"><b>${c.cur?'Şu anki konuşma':esc(fmtD(c.start))}</b><span>${fl.map(f=>`<svg class="fl"><use href="#fl-${f}"/></svg>`+esc(L[f]?L[f].trName:f)).join(', ')} · ${c.msgs.length} mesaj · ${fmtT(c.start)} - ${fmtT(c.end)}</span><p>${esc(trOf(first)||otherOf(first))}</p></button>`}).join('');
}
function showConv(ci){
 const c=allConvs()[ci];if(!c)return;openConv=c;
 P.back.hidden=false;P.act.hidden=false;P.srch.hidden=true;P.st.textContent='';P.del.textContent='Sil';P.del.classList.remove('arm');
 P.title.textContent=c.cur?'Şu anki konuşma':fmtD(c.start);
 P.list.innerHTML=c.msgs.map(m=>line(m,'',null,false)).join('');P.list.scrollTop=0;
}
function convText(c){
 return `Tercüman · ${fmtD(c.start)} · Türkçe ve ${convFar(c).map(f=>L[f]?L[f].trName:f).join(', ')}\n\n`+
  c.msgs.map(m=>`${m.t?fmtT(m.t)+' ':''}${m.from==='tr'?'Sen':'Karşı taraf'}: ${trOf(m)}\n      (${farOf(m).toUpperCase()}) ${otherOf(m)}`).join('\n\n');
}
function copyText(t){
 const ok=()=>{P.st.textContent='Kopyalandı.'};
 const old=()=>{try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok()}catch(e){P.st.textContent='Kopyalanamadı.'}};
 try{navigator.clipboard.writeText(t).then(ok,old)}catch(e){old()}
}
$('#bHist').onclick=()=>{if(live)stopListen();P.srch.value='';showList();P.pan.classList.add('open')};
$('#pClose').onclick=()=>P.pan.classList.remove('open');
P.back.onclick=showList;
P.srch.addEventListener('input',showList);
P.list.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)showConv(+b.dataset.c)});
$('#pCopy').onclick=()=>{if(openConv)copyText(convText(openConv))};
$('#pShare').onclick=()=>{if(!openConv)return;const t=convText(openConv);
 if(navigator.share)navigator.share({title:'Tercüman konuşması',text:t}).catch(e=>{if(e&&e.name!=='AbortError')copyText(t)});else copyText(t)};
P.del.onclick=function(){
 if(!openConv)return;
 if(!this.classList.contains('arm')){this.classList.add('arm');this.textContent='Emin misin? Tekrar bas';return}
 if(openConv.cur){msgs=[];save('tercuman.msgs',msgs);render()}else{hist=hist.filter(h=>h!==openConv);save('tercuman.hist',hist)}
 P.srch.value='';
 showList();
};

/* ---------- Claude page capabilities (only inside claude.ai) ---------- */
let capsDone=false;
function caps(){
 const C=window.claude;if(capsDone||!(C&&C.use))return;capsDone=true;
 C.use('dictation').then(d=>{if(!d)return;dict=d;
  d.onPartial(({text})=>{if(live&&live.eng==='dict'){live.partial=text||'';bump()}});
  d.onFinal(({text})=>{if(live&&live.eng==='dict'){live.text=(live.text+' '+(text||'')).trim();live.partial='';bump()}});
  d.onState(({state})=>{if(state==='idle'&&live&&live.eng==='dict')finish()});
  applyPrefs()}).catch(()=>{});
 C.use('sample').then(s=>{if(s)samp=s}).catch(()=>{});
 C.use('tts').then(t=>{if(t)ttsC=t}).catch(()=>{});
}
caps();setTimeout(caps,500);setTimeout(caps,2000);

let hiddenAt=0;const AWAY=2*60e3;
function freshStart(){if(live)finish();stopSpeak();archive();render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>AWAY)freshStart()});
window.addEventListener('pageshow',e=>{if(e.persisted)freshStart()});
applyLang();applyPrefs();render();
}
</script>
</body>
</html>
